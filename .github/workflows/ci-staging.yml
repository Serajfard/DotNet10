name: CI - Staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build-test:
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Runner info
        run: |
          uname -a
          dotnet --info
          docker --version || true

      - name: Setup .NET SDK 10.0.102
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-net10-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DemoApi.sln

      - name: Build
        run: |
          dotnet build DemoApi.sln \
            --configuration Release \
            --no-restore \
            /p:ImportDirectoryBuildProps=false \
            /p:ImportDirectoryBuildTargets=false

      - name: Test
        run: |
          dotnet test DemoApi.sln \
            --configuration Release \
            --no-build \
            /p:ImportDirectoryBuildProps=false \
            /p:ImportDirectoryBuildTargets=false
