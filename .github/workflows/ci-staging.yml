name: CI - Staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build-test:
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Runner info
        run: |
          uname -a
          dotnet --info
          docker --version || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-net10-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DemoApi.sln

      - name: Build
        run: dotnet build DemoApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DemoApi.sln --configuration Release --no-build
